name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released source
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Package extension
        if: ${{ steps.release.outputs.release_created }}
        shell: bash
        run: |
          ARCHIVE_NAME="canchat-local-archive-${STEPS_RELEASE_OUTPUTS_TAG_NAME}.zip"

          zip -r "$ARCHIVE_NAME" \
            manifest.json \
            src \
            ui \
            icons \
            locales

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
        env:
          STEPS_RELEASE_OUTPUTS_TAG_NAME: ${{ steps.release.outputs.tag_name }}


      - name: Upload ZIP and Publish Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} ${{ env.ARCHIVE_NAME }}
          gh release edit ${{ steps.release.outputs.tag_name }} --draft=false